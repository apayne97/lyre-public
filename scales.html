<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scales</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("lyre-theme")||"light";}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="brand" href="progressions.html">
  <svg class="brand-mark" viewBox="0 0 600 600" aria-hidden="true">
    <circle cx="300" cy="300" r="240" fill="#04223a" stroke="var(--border)" stroke-width="6"/>
    <path d="M 208.80 275.56 Q 238.80 163.60 300.00 60.00" fill="none" stroke="#046997" stroke-width="56" stroke-linecap="round"/>
    <path d="M 431.90 223.85 Q 483.87 313.85 507.85 420.00" fill="none" stroke="#60dd8e" stroke-width="56" stroke-linecap="round"/>
    <path d="M 352.29 495.13 Q 270.32 517.10 180.00 507.85" fill="none" stroke="#4DBEDF" stroke-width="56" stroke-linecap="round"/>
    <path d="M 300.00 60.00 Q 379.94 133.84 431.90 223.85" fill="none" stroke="#60dd8e" stroke-width="56" stroke-linecap="round"/>
    <path d="M 507.85 420.00 Q 434.25 473.17 352.29 495.13" fill="none" stroke="#4DBEDF" stroke-width="56" stroke-linecap="round"/>
    <path d="M 180.00 507.85 Q 178.80 387.52 208.80 275.56" fill="none" stroke="#046997" stroke-width="56" stroke-linecap="round"/>
  </svg>
  <span class="brand-text">Lyre</span>
</a>
<button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark"></button>
<div class="wrap">
  <h1>Scales</h1>
  <nav class="page-switch">
    <a href="scales.html" class="active">Scales</a>
    <a href="progressions.html">Progressions</a>
  </nav>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="controls">
        <div class="field">
          <span class="field-label">Root</span>
          <select id="root"></select>
        </div>
        <label>Scale
          <select id="scale"></select>
        </label>
      </div>
      <div class="enharmonic-row hidden" id="enharmonicRow">
        <label class="pill-toggle"><input type="checkbox" id="showEnharmonic"> List Enharmonic Scales</label>
        <div class="options hidden" id="enharmonicOptions"></div>
      </div>
      <div class="enharmonic-row">
        <label class="pill-toggle"><input type="checkbox" id="overlayChord"> Show chord</label>
      </div>
      <div class="filter-panel">
        <label><input type="checkbox" id="showCircle" checked> Chord Circle</label>
        <label><input type="checkbox" id="showInstrument" checked> Instrument</label>
        <label><input type="checkbox" id="showNotation" checked> Notation</label>
      </div>
      <div class="legend">
        <span><span class="swatch" style="background:var(--major)"></span>Major 3rd / ♭6th</span>
        <span><span class="swatch" style="background:var(--minor)"></span>Minor 3rd / 6th</span>
        <span><span class="swatch" style="background:var(--fifth)"></span>4th / 5th</span>
        <span><span class="swatch" style="background:var(--half)"></span>Half Step / 7th</span>
        <span><span class="swatch" style="background:var(--whole)"></span>Whole Step / ♭7th</span>
        <span><span class="swatch" style="background:var(--tritone)"></span>Tritone</span>
      </div>
      <div class="legend hidden" id="overlayLegend">
        <span><span class="swatch swatch-dot" style="background:var(--ink)"></span>In scale and chord</span>
        <span><span class="swatch swatch-dot" style="background:var(--ink-muted);border:2px solid var(--ink)"></span>In chord only</span>
        <span><span class="swatch swatch-dot" style="background:var(--scale-accent)"></span>In scale only</span>
      </div>
    </aside>

    <main>
      <div class="chord-name">
        <span id="scaleName"></span>
        <button id="playBtn" class="play-btn" type="button">&#9654; Play</button>
        <button id="playChordBtn" class="play-btn hidden" type="button">&#9654; Play chord</button>
        <button id="shareBtn" class="play-btn" type="button">Share</button>
        <span class="tempo"><label for="tempo">Speed</label><input type="range" id="tempo" min="0.5" max="2" step="0.25" value="1"></span>
      </div>

      <nav class="mobile-tabs">
        <div class="tab active" data-tab="circle">Chord Circle</div>
        <div class="tab" data-tab="instrument">Instrument</div>
        <div class="tab" data-tab="notation">Notation</div>
      </nav>

      <div class="views" id="views" data-tab="circle">
        <section class="view-block" id="circleBlock">
          <h2>Chord Circle</h2>
          <div class="circle-layout">
            <div class="circle-options">
              <div class="interval-toggles">
                <label><input type="checkbox" id="cat-seconds" checked> 2nds</label>
                <label><input type="checkbox" id="cat-thirds"> 3rds</label>
                <label><input type="checkbox" id="cat-fifths"> 4ths / 5ths</label>
                <label><input type="checkbox" id="cat-tritone"> Tritone</label>
                <label><input type="checkbox" id="cat-sixths"> 6ths</label>
                <label><input type="checkbox" id="cat-sevenths" checked> 7ths</label>
              </div>
            </div>
            <svg id="wheel" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </section>

        <section class="view-block" id="instrumentBlock">
          <h2 id="instrumentTitle">Piano</h2>
          <div class="interval-toggles">
            <label>Instrument
              <select id="instrument">
                <option value="piano">Piano</option>
                <option value="guitar">Guitar</option>
                <option value="bass">Bass</option>
              </select>
            </label>
          </div>
          <svg id="piano" viewBox="0 0 588 170" xmlns="http://www.w3.org/2000/svg"></svg>
          <svg id="fret" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" class="hidden"></svg>
        </section>

        <section class="view-block" id="notationBlock">
          <h2>Notation</h2>
          <svg id="staff" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg"></svg>
        </section>
      </div>
    </main>

    <aside class="sidebar chord-panel hidden" id="overlayControls">
      <div class="controls">
        <div class="field">
          <span class="field-label">Chord Root</span>
          <select id="chordRoot"></select>
        </div>
      </div>
      <div class="enharmonic-row">
        <span class="label">Scale degrees</span>
        <div class="degree-row" id="degreeOptions"></div>
      </div>
      <div class="controls">
        <label>Quality
          <select id="chordQuality">
            <option value="major">Major</option>
            <option value="minor">Minor</option>
            <option value="diminished">Diminished</option>
            <option value="augmented">Augmented</option>
          </select>
        </label>
        <label>Size
          <select id="chordSize">
            <option value="triad">Triad</option>
            <option value="7th">7th</option>
            <option value="9th">9th</option>
            <option value="11th">11th</option>
            <option value="13th">13th</option>
          </select>
        </label>
        <label>5th
          <select id="chordAlt5">
            <option value="default">Default</option>
            <option value="b">&#9837;5</option>
            <option value="s">&#9839;5</option>
          </select>
        </label>
        <label id="chordSeventhWrap">7th type
          <select id="chordSeventh"></select>
        </label>
        <label id="chordAlt9Wrap">9th
          <select id="chordAlt9"></select>
        </label>
        <label id="chordAlt11Wrap">11th
          <select id="chordAlt11"></select>
        </label>
        <label id="chordAlt13Wrap">13th
          <select id="chordAlt13"></select>
        </label>
      </div>
      <div class="enharmonic-row">
        <label class="pill-toggle"><input type="checkbox" id="showTritoneSub"> Show Tritone Sub</label>
        <div class="options hidden" id="tritoneSubOptions"></div>
        <label class="pill-toggle"><input type="checkbox" id="showResolution"> Show Resolution</label>
        <div class="options hidden" id="resolutionOptions"></div>
        <label class="pill-toggle"><input type="checkbox" id="showChordEnharmonic"> Show Enharmonic Chords</label>
        <div class="options hidden" id="chordEnharmonicOptions"></div>
      </div>
    </aside>
  </div>
</div>

<script src="theme.js"></script>
<script src="theory.js"></script>
<script src="views.js"></script>
<script>
let currentRootName = "C", currentTones = [];
let currentChordRootName = "C", currentChordTones = [];

function render() {
  const rootName = document.getElementById("root").value;
  const rootInfo = noteInfoFromName(rootName);
  const rootIdx = pitchClassOf(rootInfo.letter, rootInfo.acc);

  const scale = buildScale(document.getElementById("scale").value);
  const tones = scale.tones;
  const toneIdx = tones.map(t => (rootIdx + t.interval) % 12);

  document.getElementById("scaleName").textContent = `${rootName} ${scale.label}`;

  const matches = ENHARMONIC_MATCHES[document.getElementById("scale").value] || [];
  const enharmonicRow = document.getElementById("enharmonicRow");
  const enharmonicOptions = document.getElementById("enharmonicOptions");
  enharmonicOptions.innerHTML = "";
  // The toggle itself now lives inside enharmonicRow (replacing what used
  // to be a plain "Same notes as" label), so only the row's own list of
  // pills hides when it's off — hiding the whole row would take the
  // toggle down with it, with no way to turn it back on.
  enharmonicRow.classList.toggle("hidden", matches.length === 0);
  enharmonicOptions.classList.toggle("hidden", !document.getElementById("showEnharmonic").checked);
  matches.forEach(({ key, offset }) => {
    const pc = (rootIdx + offset) % 12;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = `${NOTE_LABELS[pc].join("/")} ${SCALES[key].label}`;
    btn.addEventListener("click", () => {
      document.getElementById("root").value = NOTE_LABELS[pc][0];
      document.getElementById("scale").value = key;
      render();
    });
    enharmonicOptions.appendChild(btn);
  });

  const enabledCategories = new Set(
    ["seconds", "thirds", "fifths", "tritone", "sixths", "sevenths"].filter(c => document.getElementById(`cat-${c}`).checked)
  );

  // Set when the chord overlay is on: piano/fretboard/notation then draw
  // scale + chord notes in the four-state scheme instead of step colors.
  let overlayView = null;
  const overlayOn = document.getElementById("overlayChord").checked;
  document.getElementById("overlayControls").classList.toggle("hidden", !overlayOn);
  document.getElementById("playChordBtn").classList.toggle("hidden", !overlayOn);
  if (overlayOn) {
    const chordRootName = document.getElementById("chordRoot").value;
    const chordRootInfo = noteInfoFromName(chordRootName);
    const chordRootIdx = pitchClassOf(chordRootInfo.letter, chordRootInfo.acc);
    const chord = buildChord({
      quality: document.getElementById("chordQuality").value,
      size: document.getElementById("chordSize").value,
      alt5: document.getElementById("chordAlt5").value,
      seventhKey: document.getElementById("chordSeventh").value,
      alt9: document.getElementById("chordAlt9").value,
      alt11: document.getElementById("chordAlt11").value,
      alt13: document.getElementById("chordAlt13").value,
    });
    const chordToneIdx = chord.tones.map(t => (chordRootIdx + t.interval) % 12);
    // Chord drives the arcs + bold dots; the scale stays visible underneath
    // as hollow rings, so you can see where the chord sits within it.
    renderCircle(chordToneIdx, enabledCategories, toneIdx, undefined, chord.tones);
    overlayView = buildOverlayView(rootName, tones, chordRootName, chord.tones);
    document.getElementById("scaleName").textContent += ` \u00B7 ${chordRootName}${chord.symbol}`;
    currentChordRootName = chordRootName;
    currentChordTones = chord.tones;
    renderChordHelpers(rootName, document.getElementById("scale").value, chordRootIdx, chordToneIdx);
  } else {
    renderCircle(toneIdx, enabledCategories, undefined, undefined, tones);
  }
  document.getElementById("overlayLegend").classList.toggle("hidden", !overlayView);

  const instrument = document.getElementById("instrument").value;
  document.getElementById("instrumentTitle").textContent =
    instrument === "piano" ? "Piano" : INSTRUMENTS[instrument].label;
  document.getElementById("piano").classList.toggle("hidden", instrument !== "piano");
  document.getElementById("fret").classList.toggle("hidden", instrument === "piano");
  const view = overlayView || { tones, toneIdx, styles: undefined };
  if (instrument === "piano") {
    renderPiano(rootName, view.tones, view.toneIdx, undefined, view.styles);
  } else {
    renderFretboard(rootName, view.tones, view.toneIdx, undefined, view.styles);
  }

  renderNotation(rootName, view.tones, view.toneIdx, undefined, view.styles);

  document.getElementById("circleBlock").classList.toggle("hidden", !document.getElementById("showCircle").checked);
  document.getElementById("instrumentBlock").classList.toggle("hidden", !document.getElementById("showInstrument").checked);
  document.getElementById("notationBlock").classList.toggle("hidden", !document.getElementById("showNotation").checked);

  currentRootName = rootName;
  currentTones = tones;
}

// Scale-degree shortcuts + the Tritone Sub / Resolution / Enharmonic Chords
// pills (moved over from the old Chords page). Every pill "jumps" the chord
// builder: it sets the real <select>s and dispatches "change" so the
// builder's own listeners (7th-type options, row visibility, persistence)
// run, then renders once.
function renderChordHelpers(scaleRootName, scaleKey, chordRootIdx, chordToneIdx) {
  const sel = (id) => document.getElementById(id);
  const setSelect = (id, value) => { sel(id).value = value; sel(id).dispatchEvent(new Event("change")); };
  const jumpTo = ({ pc, quality, size, seventhKey }) => {
    setSelect("chordRoot", NOTE_LABELS[pc][0]);
    setSelect("chordQuality", quality);
    setSelect("chordSize", size);
    if (seventhKey) setSelect("chordSeventh", seventhKey);
    render();
  };
  const addPill = (container, text, onClick) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = text;
    btn.addEventListener("click", onClick);
    container.appendChild(btn);
  };

  const degreeBox = sel("degreeOptions");
  degreeBox.innerHTML = "";
  for (const { name, degree } of scaleDegreeRoots(scaleRootName, scaleKey)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = name;
    btn.title = `Degree ${degree}`;
    btn.addEventListener("click", () => { setSelect("chordRoot", name); });
    degreeBox.appendChild(btn);
  }

  const tritoneBox = sel("tritoneSubOptions"), resBox = sel("resolutionOptions"), enhBox = sel("chordEnharmonicOptions");
  for (const box of [tritoneBox, resBox, enhBox]) box.innerHTML = "";
  tritoneBox.classList.toggle("hidden", !sel("showTritoneSub").checked);
  resBox.classList.toggle("hidden", !sel("showResolution").checked);
  enhBox.classList.toggle("hidden", !sel("showChordEnharmonic").checked);

  const quality = sel("chordQuality").value, size = sel("chordSize").value, seventh = sel("chordSeventh").value;
  const isSelf = (pc, q, s) => pc === chordRootIdx && q === quality && s === seventh;
  const subPills = new Map();
  const resolutionRoots = new Set();
  for (const domPc of tritoneDominantRoots(chordToneIdx)) {
    resolutionRoots.add(domPc);
    if (!isSelf(domPc, "major", "dominant7")) {
      subPills.set(`major|${domPc}`, { pc: domPc, quality: "major", seventhKey: "dominant7", symbol: DOMINANT7_SYMBOL });
    }
    const dimPc = diminishedSubRoot(domPc);
    if (!isSelf(dimPc, "diminished", "dim7")) {
      subPills.set(`diminished|${dimPc}`, { pc: dimPc, quality: "diminished", seventhKey: "dim7", symbol: DIM7_SYMBOL });
    }
  }
  for (const { pc, quality: q, seventhKey, symbol } of subPills.values()) {
    addPill(tritoneBox, `Tritone Sub: ${NOTE_LABELS[pc].join("/")}${symbol}`, () => jumpTo({ pc, quality: q, size: "7th", seventhKey }));
  }
  for (const pc of resolutionRoots) {
    const resIdx = dominantResolutionRoot(pc);
    addPill(resBox, `Resolves to ${NOTE_LABELS[resIdx].join("/")} Major`, () => jumpTo({ pc: resIdx, quality: "major", size: "triad" }));
    addPill(resBox, `Resolves to ${NOTE_LABELS[resIdx].join("/")} Minor`, () => jumpTo({ pc: resIdx, quality: "minor", size: "triad" }));
  }
  for (const { pc, quality: q, size: sz, seventhKey, symbol } of enharmonicChordsOf(chordRootIdx, quality, size, seventh)) {
    addPill(enhBox, `Enharmonic: ${NOTE_LABELS[pc].join("/")}${symbol}`, () => jumpTo({ pc, quality: q, size: sz, seventhKey }));
  }
}

function init() {
  const rootSel = document.getElementById("root");
  for (const n of ROOT_OPTIONS) {
    const opt = document.createElement("option");
    opt.value = n; opt.textContent = n;
    rootSel.appendChild(opt);
  }
  rootSel.value = "C";

  const scaleSel = document.getElementById("scale");
  for (const groupName of SCALE_GROUPS) {
    const group = document.createElement("optgroup");
    group.label = groupName;
    for (const key in SCALES) {
      if (SCALES[key].group !== groupName) continue;
      const opt = document.createElement("option");
      opt.value = key; opt.textContent = SCALES[key].label;
      group.appendChild(opt);
    }
    scaleSel.appendChild(group);
  }
  scaleSel.value = "major";

  // Same page-navigation problem as the Chords page's builder (see
  // wireChordBuilder's storageKey comment in views.js) — root/scale live
  // outside the builder, so they're restored by hand here instead.
  try {
    const savedRoot = localStorage.getItem("lyre-scale-root");
    if (savedRoot && [...rootSel.options].some(o => o.value === savedRoot)) rootSel.value = savedRoot;
    const savedScale = localStorage.getItem("lyre-scale-scale");
    if (savedScale && [...scaleSel.options].some(o => o.value === savedScale)) scaleSel.value = savedScale;
  } catch (e) {}
  // The chord root follows the scale root until you pick a different one
  // (i.e. only while the two are still equal), so changing key moves the
  // chord with it instead of stranding it.
  let prevScaleRoot = rootSel.value;
  rootSel.addEventListener("change", () => {
    try { localStorage.setItem("lyre-scale-root", rootSel.value); } catch (e) {}
    const chordRootSel = document.getElementById("chordRoot");
    if (chordRootSel && chordRootSel.value === prevScaleRoot) {
      chordRootSel.value = rootSel.value;
      chordRootSel.dispatchEvent(new Event("change"));
    }
    prevScaleRoot = rootSel.value;
  });
  scaleSel.addEventListener("change", () => { try { localStorage.setItem("lyre-scale-scale", scaleSel.value); } catch (e) {} });

  wireChordBuilder("chord", render, "lyre-scale-overlay");

  // Both root selects become the circular key picker (the selects stay as
  // hidden state — see mountRootPicker in views.js).
  mountRootPicker(rootSel, { title: "Scale root" });
  mountRootPicker(document.getElementById("chordRoot"), { title: "Chord root" });

  // The overlay on/off toggle persists too, otherwise a restored chord
  // would sit hidden until you re-checked the box.
  const overlayToggle = document.getElementById("overlayChord");
  try { overlayToggle.checked = localStorage.getItem("lyre-scale-overlay-on") === "1"; } catch (e) {}
  document.getElementById("overlayControls").classList.toggle("hidden", !overlayToggle.checked);
  overlayToggle.addEventListener("change", (e) => {
    try { localStorage.setItem("lyre-scale-overlay-on", e.target.checked ? "1" : "0"); } catch (err) {}
    document.getElementById("overlayControls").classList.toggle("hidden", !e.target.checked);
    render();
  });

  [
    "root", "scale", "instrument", "showCircle", "showInstrument", "showNotation", "showEnharmonic",
    "showTritoneSub", "showResolution", "showChordEnharmonic",
    "cat-seconds", "cat-thirds", "cat-fifths", "cat-tritone", "cat-sixths", "cat-sevenths",
  ].forEach(id => {
    document.getElementById(id).addEventListener("change", render);
  });
  // Two loops (scale run, chord) that stop each other, so only one sounds.
  const scaleLoop = makeLoopController(playScale);
  const chordLoop = makeLoopController(playTones);
  const playBtn = document.getElementById("playBtn");
  const playChordBtn = document.getElementById("playChordBtn");
  const tempo = () => Number(document.getElementById("tempo").value);
  function wirePlay(btn, loop, otherLoop, otherBtn, idleText, getArgs) {
    btn.addEventListener("click", () => {
      if (loop.isPlaying()) {
        loop.stop();
        btn.textContent = idleText;
      } else {
        if (otherLoop.isPlaying()) { otherLoop.stop(); otherBtn.textContent = otherBtn.dataset.idle; }
        loop.start(getArgs);
        btn.textContent = "■ Stop";
      }
    });
    btn.dataset.idle = idleText;
  }
  wirePlay(playBtn, scaleLoop, chordLoop, playChordBtn, "▶ Play", () => [currentRootName, currentTones, tempo()]);
  wirePlay(playChordBtn, chordLoop, scaleLoop, playBtn, "▶ Play chord", () => [currentChordRootName, currentChordTones, tempo()]);

  // Mobile tab bar: purely presentational (a data-tab attribute + CSS,
  // see style.css) — independent of the desktop show/hide checkboxes.
  const viewsEl = document.getElementById("views");
  document.querySelectorAll(".mobile-tabs .tab").forEach(tab => {
    tab.addEventListener("click", () => {
      viewsEl.dataset.tab = tab.dataset.tab;
      document.querySelectorAll(".mobile-tabs .tab").forEach(t => t.classList.toggle("active", t === tab));
    });
  });

  // Order matters: chordQuality/chordSize before chordSeventh (see buildShareUrl).
  const shareIds = [
    "root", "scale", "showEnharmonic",
    "cat-seconds", "cat-thirds", "cat-fifths", "cat-tritone", "cat-sixths", "cat-sevenths",
    "showCircle", "showInstrument", "showNotation",
    "overlayChord", "showTritoneSub", "showResolution", "showChordEnharmonic", "chordRoot", "chordQuality", "chordSize", "chordSeventh",
    "chordAlt5", "chordAlt9", "chordAlt11", "chordAlt13",
  ];
  wireShareButton(document.getElementById("shareBtn"), shareIds);
  applyShareHash(shareIds);
  // Pasting a share link into a tab already on this page only changes the hash (no reload).
  window.addEventListener("hashchange", () => applyShareHash(shareIds));

  render();
}
init();
</script>
</body>
</html>
