<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chords</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("lyre-theme")||"light";}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="brand" href="progressions.html">
  <svg class="brand-mark" viewBox="0 0 600 600" aria-hidden="true">
    <circle cx="300" cy="300" r="240" fill="#04223a" stroke="var(--border)" stroke-width="6"/>
    <path d="M 208.80 275.56 Q 238.80 163.60 300.00 60.00" fill="none" stroke="#046997" stroke-width="56" stroke-linecap="round"/>
    <path d="M 431.90 223.85 Q 483.87 313.85 507.85 420.00" fill="none" stroke="#60dd8e" stroke-width="56" stroke-linecap="round"/>
    <path d="M 352.29 495.13 Q 270.32 517.10 180.00 507.85" fill="none" stroke="#4DBEDF" stroke-width="56" stroke-linecap="round"/>
    <path d="M 300.00 60.00 Q 379.94 133.84 431.90 223.85" fill="none" stroke="#60dd8e" stroke-width="56" stroke-linecap="round"/>
    <path d="M 507.85 420.00 Q 434.25 473.17 352.29 495.13" fill="none" stroke="#4DBEDF" stroke-width="56" stroke-linecap="round"/>
    <path d="M 180.00 507.85 Q 178.80 387.52 208.80 275.56" fill="none" stroke="#046997" stroke-width="56" stroke-linecap="round"/>
  </svg>
  <span class="brand-text">Lyre</span>
</a>
<button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark"></button>
<div class="wrap">
  <h1>Chords</h1>
  <nav class="page-switch">
    <a href="chords.html" class="active">Chords</a>
    <a href="scales.html">Scales</a>
    <a href="progressions.html">Progressions</a>
  </nav>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="controls">
        <label>Root
          <select id="root"></select>
        </label>
        <label id="qualityWrap">Quality
          <select id="quality">
            <option value="major">Major</option>
            <option value="minor">Minor</option>
            <option value="diminished">Diminished</option>
            <option value="augmented">Augmented</option>
          </select>
        </label>
        <label>Size
          <select id="size">
            <option value="triad">Triad</option>
            <option value="6th">6th</option>
            <option value="7th">7th</option>
            <option value="9th">9th</option>
            <option value="11th">11th</option>
            <option value="13th">13th</option>
            <option value="intervals">Intervals</option>
          </select>
        </label>
        <label id="alt5Wrap">5th
          <select id="alt5">
            <option value="default">Default</option>
            <option value="b">&#9837;5</option>
            <option value="s">&#9839;5</option>
          </select>
        </label>
        <label id="seventhWrap">7th type
          <select id="seventh"></select>
        </label>
        <label id="alt9Wrap">9th
          <select id="alt9"></select>
        </label>
        <label id="alt11Wrap">11th
          <select id="alt11"></select>
        </label>
        <label id="alt13Wrap">13th
          <select id="alt13"></select>
        </label>
      </div>
      <div class="enharmonic-row" id="tritoneRow">
        <label class="pill-toggle"><input type="checkbox" id="showTritoneSub"> Show Tritone Sub</label>
        <div class="options hidden" id="tritoneSubOptions"></div>
        <label class="pill-toggle"><input type="checkbox" id="showResolution"> Show Resolution</label>
        <div class="options hidden" id="resolutionOptions"></div>
        <label class="pill-toggle"><input type="checkbox" id="showEnharmonic"> Show Enharmonic Chords</label>
        <div class="options hidden" id="enharmonicOptions"></div>
      </div>
      <div class="filter-panel">
        <label><input type="checkbox" id="showCircle" checked> Chord Circle</label>
        <label><input type="checkbox" id="showInstrument" checked> Instrument</label>
        <label><input type="checkbox" id="showNotation" checked> Notation</label>
      </div>
      <div class="legend">
        <span><span class="swatch" style="background:var(--major)"></span>Major 3rd / ♭6th</span>
        <span><span class="swatch" style="background:var(--minor)"></span>Minor 3rd / 6th</span>
        <span><span class="swatch" style="background:var(--fifth)"></span>4th / 5th</span>
        <span><span class="swatch" style="background:var(--half)"></span>Half Step / 7th</span>
        <span><span class="swatch" style="background:var(--whole)"></span>Whole Step / ♭7th</span>
        <span><span class="swatch" style="background:var(--tritone)"></span>Tritone</span>
      </div>
    </aside>

    <main>
      <div class="chord-name">
        <span id="chordName"></span>
        <button id="playBtn" class="play-btn" type="button">&#9654; Play</button>
        <button id="shareBtn" class="play-btn" type="button">Share</button>
        <span class="tempo"><label for="tempo">Speed</label><input type="range" id="tempo" min="0.5" max="2" step="0.25" value="1"></span>
      </div>

      <nav class="mobile-tabs">
        <div class="tab active" data-tab="circle">Chord Circle</div>
        <div class="tab" data-tab="instrument">Instrument</div>
        <div class="tab" data-tab="notation">Notation</div>
      </nav>

      <div class="views" id="views" data-tab="circle">
        <section class="view-block" id="circleBlock">
          <h2>Chord Circle</h2>
          <div class="circle-layout">
            <div class="circle-options">
              <div class="interval-toggles" id="categoryToggles">
                <label><input type="checkbox" id="cat-seconds"> 2nds</label>
                <label><input type="checkbox" id="cat-thirds" checked> 3rds</label>
                <label><input type="checkbox" id="cat-fifths"> 4ths / 5ths</label>
                <label><input type="checkbox" id="cat-tritone"> Tritone</label>
                <label><input type="checkbox" id="cat-sixths"> 6ths</label>
                <label><input type="checkbox" id="cat-sevenths"> 7ths</label>
              </div>
              <!-- Only shown when Size = Intervals — same pill boxes, double
                   duty: instead of toggling which relationship-arcs draw
                   between a built chord's tones, each one here directly adds
                   (or removes) the one note that's exactly this interval
                   above the root. See buildIntervalSet() in theory.js. -->
              <div class="interval-toggles hidden" id="intervalPicker">
                <label><input type="checkbox" id="iv-half"> Half step</label>
                <label><input type="checkbox" id="iv-whole"> Whole step</label>
                <label><input type="checkbox" id="iv-minor3"> Minor 3rd</label>
                <label><input type="checkbox" id="iv-major3"> Major 3rd</label>
                <label><input type="checkbox" id="iv-fourth"> 4th</label>
                <label><input type="checkbox" id="iv-tritone"> Tritone</label>
                <label><input type="checkbox" id="iv-fifth"> 5th</label>
                <label><input type="checkbox" id="iv-flat6"> &#9837;6th</label>
                <label><input type="checkbox" id="iv-sixth"> 6th</label>
                <label><input type="checkbox" id="iv-flat7"> &#9837;7th</label>
                <label><input type="checkbox" id="iv-seventh"> 7th</label>
              </div>
            </div>
            <svg id="wheel" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </section>

        <section class="view-block" id="instrumentBlock">
          <h2 id="instrumentTitle">Piano</h2>
          <div class="interval-toggles">
            <label>Instrument
              <select id="instrument">
                <option value="piano">Piano</option>
                <option value="guitar">Guitar</option>
                <option value="bass">Bass</option>
              </select>
            </label>
          </div>
          <svg id="piano" viewBox="0 0 588 170" xmlns="http://www.w3.org/2000/svg"></svg>
          <svg id="fret" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" class="hidden"></svg>
        </section>

        <section class="view-block" id="notationBlock">
          <h2>Notation</h2>
          <svg id="staff" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg"></svg>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="theme.js"></script>
<script src="theory.js"></script>
<script src="views.js"></script>
<script>
// ---------- wire it up ----------
let currentRootName = "C", currentTones = [];

function render() {
  const rootName = document.getElementById("root").value;
  const rootInfo = noteInfoFromName(rootName);
  const rootIdx = pitchClassOf(rootInfo.letter, rootInfo.acc);

  const sizeVal = document.getElementById("size").value;
  const isIntervals = sizeVal === "intervals";
  document.getElementById("categoryToggles").classList.toggle("hidden", isIntervals);
  document.getElementById("intervalPicker").classList.toggle("hidden", !isIntervals);

  const chord = isIntervals
    ? buildIntervalSet(INTERVAL_ORDER.filter(key => document.getElementById(`iv-${key}`).checked))
    : buildChord({
        quality: document.getElementById("quality").value,
        size: sizeVal,
        alt5: document.getElementById("alt5").value,
        seventhKey: document.getElementById("seventh").value,
        alt9: document.getElementById("alt9").value,
        alt11: document.getElementById("alt11").value,
        alt13: document.getElementById("alt13").value,
        addTone: sizeVal === "6th" ? 6 : undefined,
      });
  const tones = chord.tones;
  const chordIdx = tones.map(t => (rootIdx + t.interval) % 12);
  // Only buildIntervalSet sets this — undefined here just means "let
  // toneColor fall back to its normal adjacent-relationship coloring",
  // exactly the existing behavior for every other size.
  const toneColors = chord.toneColors;

  document.getElementById("chordName").textContent = isIntervals ? rootName : `${rootName}${chord.symbol}`;

  // The Tritone Sub / Resolution / Enharmonic Chords boxes are always
  // visible; they're just empty unless applicable. Intervals mode is a
  // different picker entirely (no quality/size/seventh selects to jump
  // through), so it's excluded rather than scanned.
  const tritoneRow = document.getElementById("tritoneRow");
  const tritoneSubOptions = document.getElementById("tritoneSubOptions");
  const resolutionOptions = document.getElementById("resolutionOptions");
  const enharmonicOptions = document.getElementById("enharmonicOptions");
  tritoneSubOptions.innerHTML = "";
  resolutionOptions.innerHTML = "";
  enharmonicOptions.innerHTML = "";
  tritoneRow.classList.toggle("hidden", isIntervals);
  tritoneSubOptions.classList.toggle("hidden", !document.getElementById("showTritoneSub").checked);
  resolutionOptions.classList.toggle("hidden", !document.getElementById("showResolution").checked);
  enharmonicOptions.classList.toggle("hidden", !document.getElementById("showEnharmonic").checked);
  if (!isIntervals) {
    const jumpTo = ({ pc, quality, size, seventhKey }) => {
      document.getElementById("root").value = NOTE_LABELS[pc][0];
      // Set through the real <select>s and dispatch "change" (rather than
      // calling render() alone) so wireChordBuilder's own listeners run
      // too — they're what repopulate the 7th-type options for the new
      // quality and show/hide the size-dependent rows (7th/9th/11th/13th).
      const qualitySel = document.getElementById("quality");
      qualitySel.value = quality;
      qualitySel.dispatchEvent(new Event("change"));
      const sizeSel = document.getElementById("size");
      sizeSel.value = size;
      sizeSel.dispatchEvent(new Event("change"));
      if (seventhKey) {
        // Switching quality alone defaults the 7th-type select to that
        // quality's first SEVENTH_OPTIONS entry (e.g. Half-Diminished, not
        // Diminished) — set it explicitly so a jump always lands on the
        // exact substitute chord, not a lookalike. Not needed for a 6th
        // (no 7th-type row at all).
        const seventhSel = document.getElementById("seventh");
        seventhSel.value = seventhKey;
        seventhSel.dispatchEvent(new Event("change"));
      }
      render();
    };
    const addPill = (container, text, onClick) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = text;
      btn.addEventListener("click", onClick);
      container.appendChild(btn);
    };
    const currentQuality = document.getElementById("quality").value;
    const currentSeventh = document.getElementById("seventh").value;
    const isSelf = (pc, quality, seventh) =>
      pc === rootIdx && quality === currentQuality && seventh === currentSeventh;

    const subPills = new Map(); // key: `${quality}|${pc}` -> {pc, quality, seventhKey, symbol}
    const resolutionRoots = new Set();
    for (const domPc of tritoneDominantRoots(chordIdx)) {
      resolutionRoots.add(domPc);
      if (!isSelf(domPc, "major", "dominant7")) {
        subPills.set(`major|${domPc}`, { pc: domPc, quality: "major", seventhKey: "dominant7", symbol: DOMINANT7_SYMBOL });
      }
      const dimPc = diminishedSubRoot(domPc);
      if (!isSelf(dimPc, "diminished", "dim7")) {
        subPills.set(`diminished|${dimPc}`, { pc: dimPc, quality: "diminished", seventhKey: "dim7", symbol: DIM7_SYMBOL });
      }
    }
    for (const { pc, quality, seventhKey, symbol } of subPills.values()) {
      addPill(tritoneSubOptions, `Tritone Sub: ${NOTE_LABELS[pc].join("/")}${symbol}`,
        () => jumpTo({ pc, quality, size: "7th", seventhKey }));
    }
    for (const pc of resolutionRoots) {
      const resIdx = dominantResolutionRoot(pc);
      addPill(resolutionOptions, `Resolves to ${NOTE_LABELS[resIdx].join("/")} Major`,
        () => jumpTo({ pc: resIdx, quality: "major", size: "triad" }));
      addPill(resolutionOptions, `Resolves to ${NOTE_LABELS[resIdx].join("/")} Minor`,
        () => jumpTo({ pc: resIdx, quality: "minor", size: "triad" }));
    }
    for (const { pc, quality, size, seventhKey, symbol } of enharmonicChordsOf(rootIdx, currentQuality, sizeVal, currentSeventh)) {
      addPill(enharmonicOptions, `Enharmonic: ${NOTE_LABELS[pc].join("/")}${symbol}`,
        () => jumpTo({ pc, quality, size, seventhKey }));
    }
  }

  // In Intervals mode toneColors alone drives the circle (root-relative
  // arcs only, see drawRootArcs in views.js) — enabledCategories only
  // matters for the normal pairwise-relationship system, so it's skipped
  // entirely rather than computed and ignored.
  const enabledCategories = isIntervals
    ? null
    : new Set(["seconds", "thirds", "fifths", "tritone", "sixths", "sevenths"].filter(c => document.getElementById(`cat-${c}`).checked));
  renderCircle(chordIdx, enabledCategories, undefined, isIntervals ? toneColors : undefined, tones);

  const instrument = document.getElementById("instrument").value;
  document.getElementById("instrumentTitle").textContent =
    instrument === "piano" ? "Piano" : INSTRUMENTS[instrument].label;
  document.getElementById("piano").classList.toggle("hidden", instrument !== "piano");
  document.getElementById("fret").classList.toggle("hidden", instrument === "piano");
  if (instrument === "piano") {
    renderPiano(rootName, tones, chordIdx, toneColors);
  } else {
    renderFretboard(rootName, tones, chordIdx, toneColors);
  }

  renderNotation(rootName, tones, chordIdx, toneColors);

  document.getElementById("circleBlock").classList.toggle("hidden", !document.getElementById("showCircle").checked);
  document.getElementById("instrumentBlock").classList.toggle("hidden", !document.getElementById("showInstrument").checked);
  document.getElementById("notationBlock").classList.toggle("hidden", !document.getElementById("showNotation").checked);

  currentRootName = rootName;
  currentTones = tones;
}

function init() {
  wireChordBuilder("", render, "lyre-chord");

  [
    "instrument", "showCircle", "showInstrument", "showNotation", "showTritoneSub", "showResolution", "showEnharmonic",
    "cat-seconds", "cat-thirds", "cat-fifths", "cat-tritone", "cat-sixths", "cat-sevenths",
    ...INTERVAL_ORDER.map(key => `iv-${key}`),
  ].forEach(id => {
    document.getElementById(id).addEventListener("change", render);
  });
  const loop = makeLoopController(playTones);
  const playBtn = document.getElementById("playBtn");
  playBtn.addEventListener("click", () => {
    if (loop.isPlaying()) {
      loop.stop();
      playBtn.textContent = "▶ Play";
    } else {
      loop.start(() => [currentRootName, currentTones, Number(document.getElementById("tempo").value)]);
      playBtn.textContent = "■ Stop";
    }
  });

  // Mobile tab bar: purely presentational (a data-tab attribute + CSS,
  // see style.css) — independent of the desktop show/hide checkboxes.
  const viewsEl = document.getElementById("views");
  document.querySelectorAll(".mobile-tabs .tab").forEach(tab => {
    tab.addEventListener("click", () => {
      viewsEl.dataset.tab = tab.dataset.tab;
      document.querySelectorAll(".mobile-tabs .tab").forEach(t => t.classList.toggle("active", t === tab));
    });
  });

  // Order matters: Quality/Size before Seventh (see buildShareUrl).
  const shareIds = [
    "root", "quality", "size", "seventh", "alt5", "alt9", "alt11", "alt13",
    ...INTERVAL_ORDER.map(key => `iv-${key}`),
    "cat-seconds", "cat-thirds", "cat-fifths", "cat-tritone", "cat-sixths", "cat-sevenths",
    "showCircle", "showInstrument", "showNotation", "showTritoneSub", "showResolution", "showEnharmonic",
  ];
  wireShareButton(document.getElementById("shareBtn"), shareIds);
  applyShareHash(shareIds);
  // Pasting a share link into a tab already on this page only changes the hash (no reload).
  window.addEventListener("hashchange", () => applyShareHash(shareIds));

  render();
}
init();
</script>
</body>
</html>
